<style>
:root{
  --bg:#FAF8F5; --surface:#FFFFFF; --ink:#22262A; --ink-2:#4A5057; --muted:#7E7A73;
  --line:#E8E1D6; --line-soft:#F0EAE1; --sage:#5F7767; --sage-2:#7C9484; --sage-soft:#EDF1EC;
  --terra:#A9613F; --terra-soft:#F8EEE7; --gold:#C0A16B;
  --shadow:0 1px 2px rgba(52,44,34,.04), 0 8px 24px rgba(52,44,34,.05);
  --radius:16px; --max:940px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); line-height:1.78; letter-spacing:-.01em;
  font-family:"Noto Sans KR","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background-image:radial-gradient(1200px 600px at 78% -10%, #F3EDE2 0%, rgba(243,237,226,0) 60%),
                   radial-gradient(900px 500px at 6% 8%, #EFF3EE 0%, rgba(239,243,238,0) 55%);
  background-repeat:no-repeat;
}
h1,h2,h3{font-family:"Noto Serif KR","Noto Serif SC",Georgia,"Times New Roman",serif; font-weight:600; letter-spacing:-.02em}
a{color:inherit; text-decoration:none}
p{margin:0 0 1em}
.wrap{max-width:var(--max); margin:0 auto; padding:0 24px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* header */
.topbar{position:sticky; top:0; z-index:50; background:rgba(250,248,245,.9); backdrop-filter:saturate(140%) blur(10px); border-bottom:1px solid var(--line-soft)}
.topbar .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; min-height:64px; padding-top:9px; padding-bottom:9px}
.brand{display:flex; align-items:baseline; gap:9px; font-family:"Noto Serif KR",Georgia,serif; font-size:18.5px; font-weight:600; white-space:nowrap}
.brand span{font-family:"Noto Sans KR",sans-serif; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:500}
.topnav{margin-left:auto; display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
.topnav a{white-space:nowrap; padding:6px 12px; border-radius:999px; border:1px solid transparent; transition:background .16s ease,color .16s ease,border-color .16s ease}
.topnav a:hover,.topnav a:focus-visible{color:var(--sage); background:var(--sage-soft); border-color:#DDE6DD}
.topnav a.home{color:var(--ink-2); background:var(--surface); border-color:var(--line); font-weight:500}
.topnav a.home:hover{color:var(--sage); border-color:var(--sage-2); background:var(--sage-soft)}
.lang{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface)}
.lang button{appearance:none; border:0; background:none; padding:6px 11px; font-size:12.5px; color:var(--muted); cursor:pointer; font-weight:500; line-height:1.2}
.lang button+button{border-left:1px solid var(--line-soft)}
.lang button[aria-pressed="true"]{background:var(--sage); color:#fff}
.lang button:not([aria-pressed="true"]):hover{background:var(--sage-soft); color:var(--sage)}

/* page head */
.pagehead{padding:54px 0 6px}
.eyebrow{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--sage); font-weight:600; margin:0 0 16px; display:flex; align-items:center; gap:10px}
.eyebrow::before{content:""; width:26px; height:1px; background:var(--sage-2); display:inline-block}
.pagehead h1{font-size:clamp(27px,4.4vw,38px); line-height:1.3; margin:0 0 12px; word-break:keep-all}
.pagehead .sub{font-size:15.5px; color:var(--ink-2); max-width:38em; margin:0}
.pagehead .count{margin:16px 0 0; font-size:12.5px; color:var(--muted); letter-spacing:.02em}

/* list */
.listwrap{padding:30px 0 8px}
.c-list{display:grid; gap:16px}
.c-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:26px 28px 24px; box-shadow:var(--shadow)}
.c-metarow{display:flex; flex-wrap:wrap; align-items:baseline; gap:7px; margin:0 0 9px; font-size:12.5px; color:var(--muted); letter-spacing:.01em}
.c-metarow .c-dot{color:#CFC6B6}
.c-metarow .c-src{color:var(--ink-2)}
.c-metarow .c-lang{font-size:10.5px; font-weight:700; letter-spacing:.08em; color:var(--sage); background:var(--sage-soft); border-radius:4px; padding:1px 6px}
.c-title{font-size:20px; line-height:1.5; margin:0; word-break:keep-all}
.c-title a{border-bottom:1px solid transparent; transition:color .16s ease,border-color .16s ease}
.c-title a:hover{color:var(--sage); border-bottom-color:rgba(95,119,103,.35)}
.c-quote{margin:16px 0 0; padding:13px 18px; background:#FCFAF6; border-left:2px solid #DCD3C3; font-size:14.3px; color:var(--ink-2); word-break:keep-all}
.c-quote p{margin:0}
.c-quote .lbl,.c-note .lbl{display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:6px}
.c-note{margin:16px 0 0; font-size:14.5px; color:var(--ink-2); word-break:keep-all}
.c-note .lbl{color:var(--terra)}
.c-acts{margin-top:18px; display:flex; flex-wrap:wrap; align-items:center; gap:9px}
.c-open{display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:500; color:#fff; background:var(--sage); border-radius:999px; padding:8px 16px; transition:background .16s ease}
.c-open:hover{background:#4F6557}
.c-open span[aria-hidden]{font-size:12px; opacity:.85}
.c-tag{font-size:11.5px; color:var(--muted); background:var(--sage-soft); border:1px solid #DDE6DD; border-radius:999px; padding:3px 10px}

/* empty state */
.c-empty-card{margin:6px 0 0; padding:52px 30px 46px; text-align:center; background:#FCFAF6; border:1px dashed #DFD6C6; border-radius:18px}
.c-pill{display:inline-block; font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; color:var(--sage); background:var(--sage-soft); border:1px solid #DDE6DD; border-radius:999px; padding:4px 12px}
.c-empty-card h2{font-size:20px; margin:18px 0 10px; word-break:keep-all}
.c-empty-card p{font-size:14.3px; color:var(--ink-2); margin:0 auto; max-width:30em; word-break:keep-all}
.c-empty-hint{font-size:12px !important; color:var(--muted) !important; letter-spacing:.02em; margin-top:14px !important}

footer{border-top:1px solid var(--line); margin-top:44px; padding:26px 0 44px; font-size:12.5px; color:var(--muted)}
footer .wrap{display:flex; flex-wrap:wrap; gap:10px 22px; align-items:baseline; justify-content:space-between}
footer .fl{display:flex; gap:18px; flex-wrap:wrap}
footer a:hover{color:var(--sage)}

@media (max-width:700px){
  .topbar .wrap{gap:8px 10px}
  .brand span{display:none}
  .topnav{margin-left:0; order:3; flex-basis:100%; font-size:12.5px}
  .lang{margin-left:auto}
  .pagehead{padding:36px 0 4px}
  .c-card{padding:20px 20px 18px}
  .c-title{font-size:18px}
  .c-empty-card{padding:40px 22px 36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media print{
  .topbar,footer,.c-acts{display:none !important}
  body{background:#fff}
  .c-card{break-inside:avoid; box-shadow:none}
}
</style>

<script>
(function(){
  "use strict";

  var DATA = JSON.parse(document.getElementById('curation-data').textContent || '{}');
  var ITEMS = (DATA.items || []).slice();
  var state = { lang: 'ko' };

  var I18N = {
    ko: {
      'nav.label':'바로가기','nav.pubs':'논문','nav.apps':'연구 App','nav.contact':'연락처',
      'curation.back':'← 홈으로',
      'curation.eyebrow':'추천 글 · 큐레이션','curation.h1':'추천 글 · 큐레이션',
      'curation.sub':'교수님이 직접 골라 읽은 글과 Glasp 하이라이트를 모아 둡니다. 각 글에는 출처와 원문으로 가는 링크를, 곁들일 맡이 있으면 한 줄 평을 함께 십습니다.',
      'curation.listLabel':'추천 글 목록',
      'curation.count':'{n}편의 글',
      'curation.highlight':'Glasp 하이라이트','curation.note':'한 줄 평',
      'curation.open':'원문 보기',
      'curation.empty.pill':'준비 중','curation.empty.h':'아직 등록된 글이 없습니다',
      'curation.empty.p':'교수님이 직접 선별한 Glasp 하이라이트와 추천 글을 곧 올릴 예정입니다. 글이 올라오면 이 자리에 카드로 표시됩니다.',
      'curation.empty.hint':'제목 · 출처 · 날짜 · 한 줄 평 · 원문 바로가기',
      'foot.copy':'© 2026 이용승 · 대구대학교 자유전공학부'
    },
    en: {
      'nav.label':'Shortcuts','nav.pubs':'Publications','nav.apps':'Research Apps','nav.contact':'Contact',
      'curation.back':'← Home',
      'curation.eyebrow':'Curated Reads','curation.h1':'Curated Reads',
      'curation.sub':'Articles I have read and chosen to keep, together with Glasp highlights. Each entry carries its source and a link to the original, with a one-line note where there is more to say.',
      'curation.listLabel':'List of curated reads',
      'curation.count':'{n} pieces',
      'curation.highlight':'Glasp highlight','curation.note':'Why I picked it',
      'curation.open':'Read the original',
      'curation.empty.pill':'In preparation','curation.empty.h':'No pieces listed yet',
      'curation.empty.p':'Selected Glasp highlights and recommended reads will be posted here soon. Each piece will appear as a card on this page.',
      'curation.empty.hint':'Title · Source · Date · One-line note · Link to the original',
      'foot.copy':'© 2026 Yongseung Lee · Daegu University'
    },
    zh: {
      'nav.label':'快捷链接','nav.pubs':'论文','nav.apps':'研究应用','nav.contact':'联系方式',
      'curation.back':'← 返回首页',
      'curation.eyebrow':'推荐阅读','curation.h1':'推荐阅读',
      'curation.sub':'汇集亲自选读的文章与 Glasp 划线摘录。每篇附出处与原文链接，有话要说时再添一句话推荐。',
      'curation.listLabel':'推荐阅读列表',
      'curation.count':'共 {n} 篇',
      'curation.highlight':'Glasp 划线摘录','curation.note':'一句话推荐',
      'curation.open':'阅读原文',
      'curation.empty.pill':'准备中','curation.empty.h':'暂无收录文章',
      'curation.empty.p':'亲自挑选的 Glasp 划线摘录与推荐文章即将上线，届时将在本页以卡片形式呈现。',
      'curation.empty.hint':'标题 · 出处 · 日期 · 一句话推荐 · 原文链接',
      'foot.copy':'© 2026 李容承 · 大邱大学 自由专攻学部'
    }
  };

  function t(k){
    var d = I18N[state.lang] || I18N.ko;
    return (d[k] !== undefined) ? d[k] : (I18N.ko[k] || k);
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  /* 값이 문자열이거나 {ko,en,zh} 객체일 때 현재 언어로 고른다 */
  function pick(v){
    if(v == null) return '';
    if(typeof v === 'string') return v;
    if(typeof v === 'object') return v[state.lang] || v.ko || v.en || v.zh || '';
    return String(v);
  }
  function safeUrl(u){
    return /^https?:\/\/[^\s"'<>]+$/i.test(String(u || '')) ? String(u) : '';
  }
  function fmtDate(iso){
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
    if(!m) return String(iso || '');
    var y = m[1], mo = parseInt(m[2], 10), d = parseInt(m[3], 10);
    if(state.lang === 'en'){
      var M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return M[mo-1] + ' ' + d + ', ' + y;
    }
    if(state.lang === 'zh') return y + '年' + mo + '月' + d + '日';
    return y + '. ' + mo + '. ' + d + '.';
  }

  function cardHTML(it){
    var title = pick(it.title);
    var url = safeUrl(it.url);
    var meta = [];
    var src = pick(it.source), author = pick(it.author);
    if(src || author){
      meta.push('<span class="c-src">' + esc(src) + (src && author ? ' · ' : '') + esc(author) + '</span>');
    }
    if(it.date){ meta.push('<time class="c-date" datetime="' + esc(it.date) + '">' + esc(fmtDate(it.date)) + '</time>'); }
    if(it.lang){ meta.push('<span class="c-lang">' + esc(String(it.lang).toUpperCase()) + '</span>'); }

    var quote = pick(it.quote), note = pick(it.note);
    var tags = (it.tags || []).map(function(x){ return pick(x); }).filter(Boolean)
      .map(function(x){ return '<span class="c-tag">' + esc(x) + '</span>'; }).join('');

    var h = '<article class="c-card"' + (it.id ? ' id="' + esc(it.id) + '"' : '') + '>';
    if(meta.length){
      h += '<p class="c-metarow">' + meta.join('<span class="c-dot" aria-hidden="true">·</span>') + '</p>';
    }
    h += '<h2 class="c-title">' + (url
      ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(title) + '</a>'
      : esc(title)) + '</h2>';
    if(quote){
      h += '<blockquote class="c-quote"><span class="lbl">' + esc(t('curation.highlight')) + '</span><p>' + esc(quote) + '</p></blockquote>';
    }
    if(note){
      h += '<p class="c-note"><span class="lbl">' + esc(t('curation.note')) + '</span>' + esc(note) + '</p>';
    }
    if(url || tags){
      h += '<div class="c-acts">';
      if(url){
        h += '<a class="c-open" href="' + esc(url) + '" target="_blank" rel="noopener">'
           + esc(t('curation.open')) + ' <span aria-hidden="true">↗</span></a>';
      }
      h += tags + '</div>';
    }
    return h + '</article>';
  }

  function emptyHTML(){
    return '<div class="c-empty-card">'
      + '<span class="c-pill">' + esc(t('curation.empty.pill')) + '</span>'
      + '<h2>' + esc(t('curation.empty.h')) + '</h2>'
      + '<p>' + esc(t('curation.empty.p')) + '</p>'
      + '<p class="c-empty-hint">' + esc(t('curation.empty.hint')) + '</p>'
      + '</div>';
  }

  function render(){
    var list = document.getElementById('cList');
    var empty = document.getElementById('cEmpty');
    var count = document.getElementById('cCount');
    var ordered = ITEMS.map(function(it, i){ return { it: it, i: i }; })
      .sort(function(a, b){
        var da = String(a.it.date || ''), db = String(b.it.date || '');
        if(da !== db) return da < db ? 1 : -1;
        return a.i - b.i;
      })
      .map(function(x){ return x.it; });

    if(!ordered.length){
      list.innerHTML = '';
      list.hidden = true;
      empty.hidden = false;
      empty.innerHTML = emptyHTML();
      count.textContent = '';
      return;
    }
    list.hidden = false;
    empty.hidden = true;
    empty.innerHTML = '';
    count.textContent = t('curation.count').replace('{n}', ordered.length);
    list.innerHTML = ordered.map(cardHTML).join('');
  }

  function applyLang(lang){
    state.lang = lang;
    document.documentElement.lang = (lang === 'zh' ? 'zh-Hans' : lang);
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var v = t(el.getAttribute('data-i18n'));
      if(v) el.textContent = v;
    });
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el){
      el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
    });
    document.querySelectorAll('.lang button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });
    document.title = (lang === 'ko' ? '추천 글 · 큐레이션 | 이용승 교수 · 대구대학교'
      : lang === 'en' ? 'Curated Reads | Yongseung Lee, Daegu University'
      : '推荐阅读 | 李容承 · 大邱大学');
    render();
    try{ localStorage.setItem('ys-lang', lang); }catch(e){}
  }

  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click', function(){ applyLang(b.dataset.lang); });
  });

  var saved = 'ko';
  try{ saved = localStorage.getItem('ys-lang') || 'ko'; }catch(e){}
  applyLang(['ko','en','zh'].indexOf(saved) > -1 ? saved : 'ko');
})();
</script>
</body>
</html>
