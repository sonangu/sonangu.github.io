<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>capture (temporary)</title>
<style>
  html,body{margin:0; padding:0; background:#fff}
  #shot{display:block; background:#fff}
  iframe{display:block; border:0; background:#fff}
  #info{font:12px monospace; color:#666; padding:2px 6px}
</style>
</head>
<body>
<p id="info">measuring…</p>
<div id="shot" role="img"><iframe id="f" src="/?v=911302b" title="capture"></iframe></div>
<script>
(function(){
  var SHOTS = {
    'about-d':  { w:1280, start:'#about .sec-head', end:'.about-cards' },
    'footer-d': { w:1280, start:'footer',           end:'footer' },
    'about-m':  { w:390,  start:'#about .sec-head', end:'.about-cards' }
  };
  var key = (new URLSearchParams(location.search).get('s') || 'about-d');
  var cfg = SHOTS[key] || SHOTS['about-d'];
  var f = document.getElementById('f');
  f.style.width = cfg.w + 'px';
  document.getElementById('shot').style.width = cfg.w + 'px';
  f.style.height = '600px';

  function setup(){
    var d = f.contentDocument, w = f.contentWindow;
    if(!d || !d.head || !d.body) return;
    if(!d.__injected){
      var st = d.createElement('style');
      st.textContent = '.topbar{display:none!important} html{scrollbar-width:none!important} ::-webkit-scrollbar{width:0!important;height:0!important}';
      d.head.appendChild(st);
      d.__injected = true;
    }
    var a = d.querySelector(cfg.start), b = d.querySelector(cfg.end);
    if(!a || !b) { document.getElementById('info').textContent = 'missing ' + cfg.start + ' / ' + cfg.end; return; }
    var st0 = a.getBoundingClientRect().top + w.scrollY;
    var en0 = b.getBoundingClientRect().bottom + w.scrollY;
    var h = Math.round(en0 - st0) + 24;
    f.style.height = h + 'px';
    document.getElementById('shot').style.height = h + 'px';
    w.scrollTo(0, Math.round(st0) - 12);
    document.getElementById('info').textContent = key + ' · ' + cfg.w + 'x' + h +
      ' · start=' + Math.round(st0) + ' end=' + Math.round(en0) +
      ' · visits=' + ((d.getElementById('statVisits') || {}).textContent || '-');
  }
  f.addEventListener('load', function(){ setTimeout(setup, 300); });
  setTimeout(setup, 1500);
})();
</script>
</body>
</html>
